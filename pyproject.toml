[project]
name = "phoenix-chem"
version = "0.1.0"
description = "Physicochemical Hazard Observation & Energetics Numerical Indexing eXpert - A Python library for reactive chemical hazard evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "PHOENIX Contributors" }
]
keywords = [
    "chemistry",
    "thermodynamics",
    "hazard",
    "safety",
    "CHETAH",
    "explosives",
    "energetics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "pydantic>=2.0",
    "chemicals>=1.1",
    "rdkit>=2024.03",
    "pgradd>=2.9.13",
]

[project.optional-dependencies]
pgradd = [
    "pgradd>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
]
all = [
    "phoenix-chem[pgradd,dev]",
]

[project.urls]
Homepage = "https://github.com/yourorg/phoenix-chem"
Documentation = "https://phoenix-chem.readthedocs.io"
Repository = "https://github.com/yourorg/phoenix-chem"
Issues = "https://github.com/yourorg/phoenix-chem/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phoenix"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in argument defaults
    "B905",   # zip without strict
    "SIM105", # contextlib.suppress suggestion (explicit try-except is clearer)
    "SIM116", # dict instead of if-elif (explicit branches are clearer for phase)
]

[tool.ruff.lint.isort]
known-first-party = ["phoenix"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: marks tests as slow",
    "validation: marks tests as validation suite",
]

[tool.coverage.run]
source = ["phoenix"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
